name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch TDLib Binaries
        run: cargo run -p fetch-tdlib -- windows

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build & Package Windows Distribution
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCustomTelegram-windows-x64
          path: releases/OpenCustomTelegram-windows-x64.zip

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/OpenCustomTelegram-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch TDLib Binaries
        run: cargo run -p fetch-tdlib -- linux

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Linux Binary via Tauri
        run: npx @tauri-apps/cli build --no-bundle

      - name: Package Linux Distribution
        run: |
          mkdir -p releases/OpenCustomTelegram-linux-x64
          cp target/release/app releases/OpenCustomTelegram-linux-x64/OpenCustomTelegram
          chmod +x releases/OpenCustomTelegram-linux-x64/OpenCustomTelegram
          cp .data/libtdjson.so releases/OpenCustomTelegram-linux-x64/libtdjson.so
          cp -r themes releases/OpenCustomTelegram-linux-x64/
          cp AI_THEME_PROMPT.md releases/OpenCustomTelegram-linux-x64/
          cat << 'EOF' > releases/OpenCustomTelegram-linux-x64/run.sh
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" >/dev/null 2>&1 && pwd )"
          cd "$DIR"
          chmod +x ./OpenCustomTelegram
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          exec ./OpenCustomTelegram "$@"
          EOF
          chmod +x releases/OpenCustomTelegram-linux-x64/run.sh
          cd releases && tar -czf OpenCustomTelegram-linux-x64.tar.gz OpenCustomTelegram-linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCustomTelegram-linux-x64
          path: releases/OpenCustomTelegram-linux-x64.tar.gz

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/OpenCustomTelegram-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK for Cargo
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android34-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "$NDK_BIN" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Android APK
        run: |
          cargo build --target aarch64-linux-android --release
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libapp_lib.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libapp_lib.so
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew assembleArm64Release
          cd ../../..
          mkdir -p releases
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk releases/OpenCustomTelegram-android-arm64.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCustomTelegram-android-arm64
          path: releases/OpenCustomTelegram-android-arm64.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/OpenCustomTelegram-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

