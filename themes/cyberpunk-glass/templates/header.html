<div class="chat-header-bar">
  <div class="chat-header-info">
    <div class="chat-header-avatar">{{avatar_letter}}</div>
    <div class="chat-header-text">
      <h2 class="chat-header-title">{{title}}</h2>
      <span class="chat-header-status">[LINK_ACTIVE: {{status}}]</span>
    </div>
  </div>
  <div class="chat-header-actions">
    <button class="btn-header" data-action="ai-summarize-chat" title="AI Chat Summary">// SUMMARIZE</button>
    <button class="btn-header" data-action="toggle-ghost" title="Toggle Ghost Mode">// GHOST_MODE</button>
  </div>
</div>
