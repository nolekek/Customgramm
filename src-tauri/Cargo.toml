[package]
name = "customgramm"
version = "0.1.0"
description = "Customgramm - The most customizable Telegram client"
authors = ["Customgramm Team"]
edition = "2021"

[lib]
name = "customgramm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"
thiserror = "1.0"
parking_lot = "0.12"
